name: build-push

# main マージで ECR push、PR では core を横並びチェックアウトして vet/test のみ
# （REPOSITORIES.md §4.2、認証は codetrain-infra/docs/BOOTSTRAP.md の
#  codetrain-pipeline-ecr-push ロール。region/account/role は本リポジトリの
#  Variables に登録済み: AWS_REGION / AWS_ACCOUNT_ID / AWS_ROLE_ECR_PUSH）。

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/build-push.yml"

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: codetrain-pipeline

      # go.mod の `replace github.com/gabaison-2026-09/codetrain-core => ../codetrain-core`
      # を CI でも成立させるため、core を同じ相対関係で横並びにチェックアウトする
      # （REPOSITORIES.md §5 / OPEN_ISSUES D-13。core が public のためトークン不要）。
      - uses: actions/checkout@v4
        with:
          repository: gabaison-2026-09/codetrain-core
          path: codetrain-core

      - uses: actions/setup-go@v5
        with:
          go-version-file: codetrain-pipeline/go.mod

      - name: vet & test
        working-directory: codetrain-pipeline
        run: |
          go vet ./...
          go test ./...

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: codetrain-pipeline

      - uses: actions/checkout@v4
        with:
          repository: gabaison-2026-09/codetrain-core
          path: codetrain-core

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: build & push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/codetrain-pipeline
        run: |
          docker build -f codetrain-pipeline/Dockerfile -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ github.sha }}"
